<!doctype html>
<html lang="{{ page.language }}">
<head>
  {{{ site.analytics_html }}}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {{{ page.seo_head_html }}}
  <link rel="icon" href="{{ theme.favicon_url }}" type="{{ theme.favicon_type }}">
  <link rel="apple-touch-icon" href="{{ theme.apple_touch_icon_url }}">
  <link rel="stylesheet" href="{{ theme.asset_url }}/style.css?v={{ theme.asset_version }}">
</head>
<body>
  <input type="checkbox" id="theme-toggle-input" class="theme-toggle-input">

  <div class="site">
    <header class="site-header">
      <div class="site-header-inner">
        <a class="site-title" href="{{ site.home_url }}">{{ site.name }}</a>
        <p class="site-description">{{ site.description }}</p>

        <nav class="site-nav" aria-label="主要ページ">
          {{# nav.primary_items }}<a href="{{ url }}">{{ label }}</a>{{/ nav.primary_items }}
        </nav>
      </div>
    </header>

    <main class="site-main">
      {{{ page.body }}}
    </main>

    <footer class="site-footer">
      <p>Powered by Tomos</p>
      <p>From Kyoto, Japan — for the Small Web.</p>
    </footer>
  </div>

  <div class="theme-toggle">
    <label for="theme-toggle-input" class="theme-toggle-btn" aria-label="表示モードを切り替え">
      <svg class="theme-toggle-icon theme-toggle-icon--sun" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
        <circle cx="12" cy="12" r="5" fill="currentColor"/>
        <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="12" y1="1.5" x2="12" y2="4"/>
          <line x1="12" y1="20" x2="12" y2="22.5"/>
          <line x1="1.5" y1="12" x2="4" y2="12"/>
          <line x1="20" y1="12" x2="22.5" y2="12"/>
          <line x1="4.5" y1="4.5" x2="6.2" y2="6.2"/>
          <line x1="17.8" y1="17.8" x2="19.5" y2="19.5"/>
          <line x1="4.5" y1="19.5" x2="6.2" y2="17.8"/>
          <line x1="17.8" y1="6.2" x2="19.5" y2="4.5"/>
        </g>
      </svg>
      <svg class="theme-toggle-icon theme-toggle-icon--moon" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" fill="currentColor"/>
        <path d="M18.5 3.5l0.7 1.7 1.7 0.7-1.7 0.7-0.7 1.7-0.7-1.7-1.7-0.7 1.7-0.7z" fill="currentColor"/>
      </svg>
    </label>
  </div>
</body>
</html>
